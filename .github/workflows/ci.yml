name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "audit/**"
  pull_request:

jobs:
  web-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Web implementation
        uses: actions/checkout@v4

      - name: Checkout pinned HappyMeasure oracle
        uses: actions/checkout@v4
        with:
          repository: Xiaolong-6/HappyMeasure
          ref: 402b88f1c42cff41bf6054e1724bc62b4deb7af3
          path: oracle-hm

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: JavaScript syntax check
        run: |
          for file in src/*.js tests/*.js tools/*.js; do
            node --check "$file"
          done

      - name: Install Python oracle dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Generate pinned Python oracle fixtures
        env:
          PYTHONPATH: oracle-hm/src
        run: python tools/generate_python_oracle.py

      - name: Generate Web project fixtures
        run: node tools/create_web_project_fixture.js

      - name: Validate Web projects in Python
        env:
          PYTHONPATH: oracle-hm/src
        run: python tools/validate_web_project.py

      - name: Run JS tests including Python oracle parity
        env:
          REQUIRE_PYTHON_ORACLE: "1"
        run: npm test

      - name: Verify direct file URL boot
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          PROFILE="$(mktemp -d)"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --disable-component-update \
            --disable-default-apps \
            --disable-extensions \
            --disable-sync \
            --no-first-run \
            --no-default-browser-check \
            --allow-file-access-from-files \
            --remote-debugging-port=9222 \
            --user-data-dir="$PROFILE" \
            about:blank >/tmp/hm-map-chrome.out 2>/tmp/hm-map-chrome.err &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" 2>/dev/null || true' EXIT
          FILE_URL="file://$PWD/index.html" node tools/check_file_boot.mjs
